<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="课间">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="课间，个人课表与作业。">
  <meta name="robots" content="noindex,nofollow">
  <title>课间 · 班级课程助手</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./workspace.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <div class="app-shell">
    <header class="app-header">
      <a href="#today" class="brand" aria-label="课间首页"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span>课间<small>MEM TIMETABLE</small></span></a>
      <div class="header-actions"><button class="semester-button" id="semester-button" aria-haspopup="dialog"><span class="status-dot"></span><span class="semester-label">2026 秋冬</span><svg class="tiny-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="account-button" class="account-button" data-account>账号</button></div>
    </header>
    <main id="main" tabindex="-1"><div class="loading"><span class="loading-dot"></span><p>正在加载课表…</p></div></main>
    <nav class="bottom-nav" aria-label="主导航">
      <a href="#today" data-route="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>今天</span></a>
      <a href="#week" data-route="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18M8 14h2m4 0h2m-8 3h2m4 0h2"/></svg><span>周课表</span></a>
      <a href="#homework" data-route="homework"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="m8 9 2 2 4-4M8 15h8"/></svg><span>作业</span></a>
      <a href="#courses" data-route="courses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-3-1H4V4Zm9 3a3 3 0 0 1 3-3h4v16h-4a4 4 0 0 0-3 1"/></svg><span>课程</span></a>
      <a href="#more" data-more aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>更多</span></a>
      <a href="#ai" data-route="ai" data-ai-nav><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 1.7 5.3L17 12l-5.3 1.7L10 19l-1.7-5.3L3 12l5.3-1.7L10 5ZM19 3v4m-2-2h4m-2 12v4m-2-2h4"/></svg><span>连接 AI</span></a>
      <a href="#manage" data-route="manage" data-management hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>课程管理</span></a>
    </nav>
  </div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <div id="hw-toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>请开启 JavaScript 以查看课程表。</p></noscript>
</body>
</html>
